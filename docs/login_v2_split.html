<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmarteeJapan - Login v2 Split</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
    }
    .left {
      flex: 1;
      background: linear-gradient(145deg, #1a3a5c 0%, #5B9BD5 60%, #4ECDC4 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 56px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .left::before {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      top: -80px; left: -80px;
    }
    .left::after {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      bottom: -60px; right: -60px;
    }
    .left-logo {
      margin-bottom: 48px;
    }
    .left-logo img {
      height: 36px;
      filter: brightness(0) invert(1);
    }
    .left h1 {
      font-size: 34px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 16px;
    }
    .left p {
      font-size: 15px;
      opacity: 0.8;
      line-height: 1.7;
      max-width: 340px;
    }
    .badges {
      display: flex;
      gap: 12px;
      margin-top: 40px;
      flex-wrap: wrap;
    }
    .badge {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 12px;
    }
    .right {
      width: 480px;
      min-width: 380px;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 52px;
    }
    h2 {
      font-size: 26px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 13px;
      color: #999;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }
    .input-wrap {
      position: relative;
      margin-bottom: 20px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e0e4ea;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
      background: #fafbfc;
    }
    input:focus {
      border-color: #5B9BD5;
      box-shadow: 0 0 0 3px rgba(91,155,213,0.1);
      background: #fff;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      font-size: 13px;
    }
    .row label { margin: 0; font-weight: 400; color: #777; cursor: pointer; }
    .row input[type="checkbox"] { margin-right: 5px; accent-color: #5B9BD5; }
    .forgot { color: #5B9BD5; text-decoration: none; font-size: 13px; }
    .forgot:hover { text-decoration: underline; }
    .btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(90deg, #5B9BD5, #4ECDC4);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      letter-spacing: 0.5px;
    }
    .btn:hover { opacity: 0.88; }
    .signup {
      text-align: center;
      margin-top: 28px;
      font-size: 13px;
      color: #999;
    }
    .signup a { color: #5B9BD5; text-decoration: none; font-weight: 600; }
    .signup a:hover { text-decoration: underline; }
    footer {
      margin-top: 40px;
      font-size: 11px;
      color: #ccc;
    }
    @media (max-width: 768px) {
      .left { display: none; }
      .right { width: 100%; min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="left">
    <div class="left-logo">
      <img src="smtlogo.png" alt="SmarteeJapan" />
    </div>
    <h1>勤怠管理を<br />もっとスマートに。</h1>
    <p>SmarteeJapanの勤怠管理システムで、チームの働き方をシンプルかつ効率的に管理しましょう。</p>
    <div class="badges">
      <span class="badge">打刻管理</span>
      <span class="badge">残業申請</span>
      <span class="badge">休暇申請</span>
      <span class="badge">給与計算連携</span>
    </div>
  </div>

  <div class="right">
    <h2>おかえりなさい</h2>
    <p class="sub">アカウントにサインインしてください</p>

    <label for="email">メールアドレス</label>
    <div class="input-wrap">
      <input type="email" id="email" placeholder="example@smarteejapan.com" />
    </div>

    <label for="password">パスワード</label>
    <div class="input-wrap">
      <input type="password" id="password" placeholder="パスワードを入力してください" />
    </div>

    <div class="row">
      <label><input type="checkbox" />ログイン状態を保持する</label>
      <a href="#" class="forgot">パスワードを忘れた方</a>
    </div>

    <button class="btn">ログイン</button>

    <p class="signup">アカウントをお持ちでない方は <a href="#">新規登録はこちら</a></p>

    <footer>&copy; 2026 SmarteeJapan. All rights reserved.</footer>
  </div>
</body>
</html>
