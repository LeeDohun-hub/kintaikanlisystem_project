<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmarteeJapan - Login v4 Glassmorphism</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a3a5c 0%, #2d6a8a 30%, #5B9BD5 60%, #4ECDC4 100%);
      position: relative;
      overflow: hidden;
    }
    /* Decorative blobs */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
    }
    .blob-1 { width: 500px; height: 500px; background: #4ECDC4; top: -150px; right: -100px; }
    .blob-2 { width: 400px; height: 400px; background: #5B9BD5; bottom: -100px; left: -80px; }
    .blob-3 { width: 300px; height: 300px; background: #a8d8ea; top: 40%; left: 30%; }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 48px 40px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.2);
    }
    .logo-wrap {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-wrap img {
      height: 38px;
      filter: brightness(0) invert(1);
    }
    h2 {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .sub {
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.65);
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      margin-bottom: 7px;
      letter-spacing: 0.4px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.2);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      font-size: 14px;
      color: #fff;
      outline: none;
      transition: border 0.2s, background 0.2s;
      margin-bottom: 18px;
    }
    input::placeholder { color: rgba(255,255,255,0.45); }
    input:focus {
      border-color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.28);
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 26px;
      font-size: 12px;
    }
    .row label { margin: 0; font-weight: 400; color: rgba(255,255,255,0.75); cursor: pointer; letter-spacing: 0; }
    .row input[type="checkbox"] { accent-color: #4ECDC4; margin-right: 5px; }
    .forgot { color: rgba(255,255,255,0.85); text-decoration: none; }
    .forgot:hover { color: #fff; text-decoration: underline; }
    .btn {
      width: 100%;
      padding: 13px;
      background: rgba(255, 255, 255, 0.95);
      color: #2d6a8a;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.3px;
    }
    .btn:hover { background: #fff; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0;
      color: rgba(255,255,255,0.4);
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.2);
    }
    .signup {
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.7);
    }
    .signup a { color: #fff; text-decoration: none; font-weight: 700; }
    .signup a:hover { text-decoration: underline; }
    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 28px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
    }
    .dot.active { background: rgba(255,255,255,0.9); }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="container">
    <div class="glass-card">
      <div class="logo-wrap">
        <img src="smtlogo.png" alt="SmarteeJapan" />
      </div>
      <h2>ログイン</h2>
      <p class="sub">勤怠管理システムへようこそ</p>

      <label for="email">メールアドレス</label>
      <input type="email" id="email" placeholder="example@smarteejapan.com" />

      <label for="password">パスワード</label>
      <input type="password" id="password" placeholder="パスワードを入力" />

      <div class="row">
        <label><input type="checkbox" />ログイン状態を保持する</label>
        <a href="#" class="forgot">パスワードを忘れた方</a>
      </div>

      <button class="btn">ログイン</button>

      <div class="divider">または</div>

      <p class="signup">アカウントをお持ちでない方は <a href="#">新規登録</a></p>

      <div class="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  </div>
</body>
</html>
