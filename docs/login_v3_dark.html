<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmarteeJapan - Login v3 Dark Corporate</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      background: #0f1923;
    }
    .sidebar {
      width: 260px;
      background: #0a1118;
      border-right: 1px solid #1e2d3d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 24px;
    }
    .sidebar-logo img {
      height: 32px;
      filter: brightness(0) invert(1);
    }
    .sidebar-nav {
      width: 100%;
    }
    .sidebar-nav p {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #3a5068;
      margin-bottom: 14px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 8px;
      color: #4a6a84;
      font-size: 13px;
      margin-bottom: 4px;
      transition: background 0.2s;
    }
    .nav-item .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #3a5068;
    }
    .sidebar-footer {
      font-size: 10px;
      color: #2a3d50;
      text-align: center;
    }
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    .card {
      background: #16202b;
      border: 1px solid #1e2d3d;
      border-radius: 16px;
      padding: 48px 44px;
      width: 100%;
      max-width: 440px;
    }
    .card-header {
      margin-bottom: 32px;
    }
    .system-badge {
      display: inline-block;
      background: rgba(91,155,213,0.15);
      color: #5B9BD5;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(91,155,213,0.3);
      margin-bottom: 14px;
    }
    h2 {
      font-size: 24px;
      font-weight: 700;
      color: #e8edf2;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 13px;
      color: #4a6a84;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #5a8aaa;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background: #0f1923;
      border: 1.5px solid #1e2d3d;
      border-radius: 8px;
      font-size: 14px;
      color: #c8d8e8;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
      margin-bottom: 20px;
    }
    input::placeholder { color: #2a4055; }
    input:focus {
      border-color: #5B9BD5;
      box-shadow: 0 0 0 3px rgba(91,155,213,0.12);
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }
    .row label {
      margin: 0; font-size: 12px; font-weight: 400;
      color: #4a6a84; text-transform: none; letter-spacing: 0; cursor: pointer;
    }
    .row input[type="checkbox"] { accent-color: #5B9BD5; margin-right: 5px; }
    .forgot { color: #5B9BD5; text-decoration: none; font-size: 12px; }
    .forgot:hover { text-decoration: underline; }
    .btn {
      width: 100%;
      padding: 13px;
      background: #5B9BD5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      letter-spacing: 0.5px;
    }
    .btn:hover { background: #4A87C0; }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0;
      color: #2a3d50;
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #1e2d3d;
    }
    .signup {
      text-align: center;
      font-size: 12px;
      color: #4a6a84;
    }
    .signup a { color: #5B9BD5; text-decoration: none; font-weight: 600; }
    .status-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #1e2d3d;
    }
    .status-item {
      text-align: center;
    }
    .status-item .val {
      font-size: 18px;
      font-weight: 700;
      color: #4ECDC4;
    }
    .status-item .lbl {
      font-size: 10px;
      color: #3a5068;
      margin-top: 2px;
    }
    @media (max-width: 700px) {
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-logo">
      <img src="smtlogo.png" alt="SmarteeJapan" />
    </div>
    <div class="sidebar-nav">
      <p>メニュー</p>
      <div class="nav-item"><span class="dot"></span>ダッシュボード</div>
      <div class="nav-item"><span class="dot"></span>打刻管理</div>
      <div class="nav-item"><span class="dot"></span>休暇申請</div>
      <div class="nav-item"><span class="dot"></span>残業管理</div>
      <div class="nav-item"><span class="dot"></span>レポート</div>
    </div>
    <div class="sidebar-footer">&copy; 2026 SmarteeJapan</div>
  </div>

  <div class="main">
    <div class="card">
      <div class="card-header">
        <span class="system-badge">勤怠管理システム</span>
        <h2>ログイン</h2>
        <p class="sub">アカウントの認証情報を入力してください</p>
      </div>

      <label for="email">メールアドレス</label>
      <input type="email" id="email" placeholder="example@smarteejapan.com" />

      <label for="password">パスワード</label>
      <input type="password" id="password" placeholder="••••••••" />

      <div class="row">
        <label><input type="checkbox" />ログイン状態を保持</label>
        <a href="#" class="forgot">パスワードを忘れた方</a>
      </div>

      <button class="btn">ログイン</button>

      <div class="divider">または</div>

      <p class="signup">アカウントをお持ちでない方は <a href="#">新規登録</a></p>

      <div class="status-bar">
        <div class="status-item">
          <div class="val">99.9%</div>
          <div class="lbl">稼働率</div>
        </div>
        <div class="status-item">
          <div class="val">SSL</div>
          <div class="lbl">セキュリティ</div>
        </div>
        <div class="status-item">
          <div class="val">24/7</div>
          <div class="lbl">サポート</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
