<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmarteeJapan - Login v1 Minimal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
    }
    .logo-wrap {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-wrap img {
      height: 40px;
    }
    h2 {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 6px;
    }
    .sub {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #dde1e7;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
      margin-bottom: 18px;
      background: #fafbfc;
    }
    input:focus { border-color: #5B9BD5; background: #fff; }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 13px;
    }
    .row label { margin: 0; font-weight: 400; color: #666; }
    .row input[type="checkbox"] { margin-right: 5px; accent-color: #5B9BD5; }
    .forgot { color: #5B9BD5; text-decoration: none; }
    .forgot:hover { text-decoration: underline; }
    .btn {
      width: 100%;
      padding: 12px;
      background: #5B9BD5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #4A87C0; }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      color: #bbb;
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #eee;
    }
    .signup {
      text-align: center;
      font-size: 13px;
      color: #888;
    }
    .signup a { color: #5B9BD5; text-decoration: none; font-weight: 600; }
    .signup a:hover { text-decoration: underline; }
    footer {
      text-align: center;
      margin-top: 32px;
      font-size: 11px;
      color: #bbb;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="smtlogo.png" alt="SmarteeJapan Logo" />
    </div>
    <h2>ログイン</h2>
    <p class="sub">勤怠管理システムにサインインしてください</p>

    <label for="email">メールアドレス</label>
    <input type="email" id="email" placeholder="example@smarteejapan.com" />

    <label for="password">パスワード</label>
    <input type="password" id="password" placeholder="パスワードを入力" />

    <div class="row">
      <label><input type="checkbox" />ログイン状態を保持する</label>
      <a href="#" class="forgot">パスワードを忘れた方</a>
    </div>

    <button class="btn">ログイン</button>

    <div class="divider">または</div>

    <p class="signup">アカウントをお持ちでない方は <a href="#">新規登録</a></p>

    <footer>&copy; 2026 SmarteeJapan. All rights reserved.</footer>
  </div>
</body>
</html>
