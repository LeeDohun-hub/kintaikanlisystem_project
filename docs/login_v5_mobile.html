<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmarteeJapan - Login v5 Mobile First</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .phone-frame {
      width: 390px;
      min-height: 700px;
      background: #fff;
      border-radius: 36px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.13);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      height: 200px;
      background: linear-gradient(160deg, #5B9BD5 0%, #4ECDC4 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 0 0 32px;
      position: relative;
    }
    .top-bar::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0;
      height: 40px;
      background: #fff;
      border-radius: 40px 40px 0 0;
    }
    .top-bar img {
      height: 38px;
      filter: brightness(0) invert(1);
      position: relative;
      z-index: 1;
    }
    .top-circle {
      position: absolute;
      width: 300px; height: 300px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      top: -100px; right: -80px;
    }
    .body {
      flex: 1;
      padding: 8px 32px 32px;
      display: flex;
      flex-direction: column;
    }
    h2 {
      font-size: 24px;
      font-weight: 800;
      color: #1a1a2e;
      margin-bottom: 4px;
    }
    .sub {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #888;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .input-group {
      position: relative;
      margin-bottom: 16px;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      opacity: 0.35;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 13px 14px 13px 42px;
      border: 1.5px solid #e8edf3;
      border-radius: 12px;
      font-size: 14px;
      background: #f8fafc;
      color: #333;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: #5B9BD5;
      box-shadow: 0 0 0 3px rgba(91,155,213,0.1);
      background: #fff;
    }
    .forgot-wrap {
      text-align: right;
      margin-bottom: 24px;
    }
    .forgot { color: #5B9BD5; text-decoration: none; font-size: 12px; font-weight: 600; }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #5B9BD5, #4ECDC4);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(91,155,213,0.35);
      transition: opacity 0.2s, transform 0.1s;
      margin-bottom: 20px;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); box-shadow: none; }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ccc;
      font-size: 12px;
      margin-bottom: 20px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #eee;
    }
    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .remember input { accent-color: #5B9BD5; }
    .signup {
      text-align: center;
      font-size: 13px;
      color: #aaa;
      margin-top: auto;
      padding-top: 20px;
    }
    .signup a { color: #5B9BD5; text-decoration: none; font-weight: 700; }
    .home-indicator {
      width: 120px;
      height: 4px;
      background: #ddd;
      border-radius: 4px;
      margin: 16px auto 8px;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="top-bar">
      <div class="top-circle"></div>
      <img src="smtlogo.png" alt="SmarteeJapan" />
    </div>

    <div class="body">
      <h2>ログイン</h2>
      <p class="sub">勤怠管理システムへサインイン</p>

      <label for="email">メールアドレス</label>
      <div class="input-group">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="#5B9BD5" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <input type="email" id="email" placeholder="example@smarteejapan.com" />
      </div>

      <label for="password">パスワード</label>
      <div class="input-group">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="#5B9BD5" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="password" placeholder="パスワードを入力" />
      </div>

      <label class="remember">
        <input type="checkbox" />ログイン状態を保持する
      </label>

      <div class="forgot-wrap">
        <a href="#" class="forgot">パスワードを忘れた方</a>
      </div>

      <button class="btn">ログイン</button>

      <div class="divider">または</div>

      <p class="signup">アカウントをお持ちでない方は <a href="#">新規登録</a></p>
    </div>
    <div class="home-indicator"></div>
  </div>
</body>
</html>
