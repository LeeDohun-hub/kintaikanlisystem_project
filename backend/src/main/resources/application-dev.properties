spring.jpa.show-sql=true
server.error.include-message=always
server.error.include-exception=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration-dev

# 招待メールに記載するログイン画面の基底URL（フロントの公開URL。末尾スラッシュ不要）
app.invite.public-base-url=http://localhost:5173

# 送信元（未設定時は spring.mail.username）
# app.invite.from-address=noreply@example.com

# メール送信を行う場合（未設定のとき send API は案内メッセージで失敗します）
