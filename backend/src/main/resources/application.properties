spring.application.name=kintai-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/kintai_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=!lee201204098
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# スキーマは Flyway が管理（初回は V1 でテーブル作成、ddl-auto=update はエンティティ差分の補助に利用）
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

spring.sql.init.mode=never

server.servlet.session.timeout=3600s

logging.level.com.kintai.service.AttendanceImportService=DEBUG
server.error.include-message=never
server.error.include-exception=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# 招待メールに記載するログイン画面の基底URL（末尾スラッシュ不要）
