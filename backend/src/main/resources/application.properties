spring.application.name=kintai-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/kintai_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=root
# 로컬 비밀번호는 application-local.properties( gitignore ) 또는 환경변수로 설정
spring.datasource.password=!lee201204098
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL: 기동 시 테이블·시드 자동 적용 (Hibernate보다 먼저 실행되도록 defer 미사용)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/init-schema.sql

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.servlet.session.timeout=3600s
server.error.include-message=always
server.error.include-exception=true
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
