spring.application.name=kintai-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/kintai_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=root
# 비밀번호는 커밋하지 않습니다.
# - 로컬: application-local.properties (gitignore) 또는 환경변수 사용
# - 운영/사내: 환경변수/시크릿 매니저 사용
# 예) SPRING_DATASOURCE_PASSWORD=...
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 스키마는 Flyway가 관리합니다.
spring.flyway.enabled=true
# 기존 DB가 이미 존재하는 환경(사내)에서 점진 도입을 위해 baseline 처리
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.servlet.session.timeout=3600s
server.error.include-message=never
server.error.include-exception=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
