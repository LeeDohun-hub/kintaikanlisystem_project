spring.application.name=kintai-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/kintai_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=root
# 로컬 비밀번호는 application-local.properties( gitignore ) 또는 환경변수로 설정
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.servlet.session.timeout=3600s
spring.jackson.serialization.fail-on-empty-beans=false
